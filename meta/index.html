<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel = "stylesheet" href = "../style.css">
    <script src = "../global.js" type = "module"></script>
    <script src = "./main.js" type = "module"></script>
</head>
<body>
    
    
    <h1>
        Meta
    </h1>

    <h2>
        Summary
    </h2>
    
    <div class="filter-bar">
        <label>
            Show commits until: 
            <input type="range" min="0" max="100" id="commit-progress">
            <time id="commit-time"></time>
        </label>
    </div>

    
    
    <div id="stats">

    </div>

    <h2>Commits by time of day</h2>
    
    <div id="scrolly-1">
        <div id="scatter-story">some filler text here</div>
        <div id="scatter-plot">
            <div id="chart"></div>

            <dl id="commit-tooltip" class="info tooltip" hidden>
                <dt>Commit</dt>
                <dd>
                    <a href="" id="commit-link" target="_blank"></a>
                </dd>

                <dt>Date</dt>
                <dd id="commit-date"></dd>

                <!-- Add: Time, author, lines edited -->
            </dl>
            <p id="selection-count">No commits selected</p>

            <dl id="language-breakdown" class="stats"></dl>

            <dl id="files">
                <!-- we want to achieve this -->
            </dl>
        </div>
    </div>

    
</body>
</html>
